<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | MovieBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">MovieBook</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
      <span id="auth-nav" class="auth-nav"><a href="login.html">Login</a><a class="nav-button" href="register.html">Register</a></span>
    </nav>
  </header>
  <main class="form-card">
    <h1>Create an account</h1>
    <p>Register to book your movie tickets.</p>
    <p class="form-message" id="form-message" role="alert" hidden></p>
    <form id="register-form">
      <label>Full name<input type="text" name="fullName" placeholder="Your full name" autocomplete="name" required></label>
      <label>Email<input type="email" name="email" placeholder="you@example.com" autocomplete="email" required></label>
      <label>Phone number<input type="tel" name="phone" placeholder="98XXXXXXXX" autocomplete="tel" required></label>
      <label>Password<input type="password" name="password" minlength="8" maxlength="72" placeholder="At least 8 characters" autocomplete="new-password" required></label>
      <label>Confirm password<input type="password" name="confirmPassword" minlength="8" maxlength="72" autocomplete="new-password" required></label>
      <button class="primary-button" type="submit">Create account</button>
    </form>
    <p class="small">Already registered? <a href="login.html">Login</a></p>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
