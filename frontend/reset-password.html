<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password | MovieBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">MovieBook</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
      <span id="auth-nav" class="auth-nav"><a href="login.html">Login</a><a class="nav-button" href="register.html">Register</a></span>
    </nav>
  </header>
  <main class="form-card">
    <h1>Choose a new password</h1>
    <p>Pick a password of at least 8 characters.</p>
    <p class="form-message" id="form-message" role="alert" hidden></p>
    <form id="reset-form">
      <label>New password<input type="password" name="newPassword" minlength="8" maxlength="72" autocomplete="new-password" required></label>
      <label>Confirm new password<input type="password" name="confirmPassword" minlength="8" maxlength="72" autocomplete="new-password" required></label>
      <button class="primary-button" type="submit">Reset password</button>
    </form>
    <p class="small"><a href="login.html">Back to login</a> · <a href="forgot-password.html">Request a new link</a></p>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
