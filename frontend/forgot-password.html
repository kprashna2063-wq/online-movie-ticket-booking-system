<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | MovieBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">MovieBook</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
      <span id="auth-nav" class="auth-nav"><a href="login.html">Login</a><a class="nav-button" href="register.html">Register</a></span>
    </nav>
  </header>
  <main class="form-card">
    <h1>Forgot your password?</h1>
    <p>Enter the email you registered with and we will send you a link to choose a new password.</p>
    <p class="form-message" id="form-message" role="alert" hidden></p>
    <form id="forgot-form">
      <label>Email<input type="email" name="email" placeholder="you@example.com" autocomplete="email" required></label>
      <button class="primary-button" type="submit">Send reset link</button>
    </form>
    <p class="small"><a href="login.html">Back to login</a></p>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
