spring.application.name=movie-ticket-booking
server.port=8080

# Configure your local MySQL database before enabling database features.
spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking
spring.datasource.username=root
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------------------
# Session / authentication
# ---------------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true when the site is served over HTTPS (production):
server.servlet.session.cookie.secure=false

# ---------------------------------------------------------------------------
# Serve the ../frontend folder from the backend, so the site is available at
# http://localhost:8080/ and login cookies work without any cross-origin setup.
# (Relative to the folder you run Maven from: backend/)
# ---------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:../frontend/

# Browser origins allowed to call the API if you serve the frontend elsewhere (e.g. VS Code Live Server).
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000

# ---------------------------------------------------------------------------
# Forgot password
# ---------------------------------------------------------------------------
# Base URL used to build the link in the reset email (where reset-password.html is served).
app.frontend-base-url=http://localhost:8080
# How long a reset link stays valid.
app.password-reset.token-minutes=30
app.mail.from=no-reply@moviebook.local

# Email delivery. Without spring.mail.host the reset link is printed in the backend log (development only).
# Example for Gmail (use an App Password, never your real password; keep secrets out of Git):
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=your.address@gmail.com
#spring.mail.password=YOUR_APP_PASSWORD
